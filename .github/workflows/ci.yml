name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, type-check, test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Ruff (lint)
        run: uv run ruff check

      - name: Ruff (format check)
        run: uv run ruff format --check

      - name: Mypy (strict)
        run: uv run mypy src

      - name: Pytest unit only (integration + evals run in evals.yml)
        run: uv run pytest -q tests/unit
