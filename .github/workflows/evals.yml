name: Evals (trivial)

on:
  # Manual only by default. The Groq free tier (200k tokens/day) is shared across
  # every workflow run; auto-triggering on every push burns the daily quota in two
  # eval cycles. Run this from the Actions tab when you want a fresh measurement,
  # or open a PR that touches the agent code — pull_request runs are gated by
  # paths so they only fire for changes that actually affect resolved@1.
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'evals/**'
      - 'src/issue_to_pr/executor/**'
      - 'src/issue_to_pr/llm/**'
      - 'src/issue_to_pr/sandbox/**'
      - 'src/issue_to_pr/issues.py'
      - 'src/issue_to_pr/settings.py'

permissions:
  contents: read

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivial-eval:
    name: Trivial issue set (10 issues, resolved@1 >= 70%)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Pytest integration (LLMClient real Groq smoke)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: uv run pytest -q tests/integration
        timeout-minutes: 5

      - name: Run trivial eval set (10 issues end-to-end)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          uv run python -m evals.runner --set trivial --out eval-report.json
        timeout-minutes: 15

      - name: Check regression gate
        run: |
          uv run python -m evals.check_regression --report eval-report.json --threshold 0.70

      - name: Upload eval report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval-report.json
          retention-days: 30
