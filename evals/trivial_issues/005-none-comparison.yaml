id: "005-none-comparison"
description: |
  The `is_none` function uses `value == None` to check for None. That is wrong because
  any object can override `__eq__` and return True. A trickster class in the tests does
  exactly that and breaks the comparison.

  Fix the function to use `is None` instead. Do not modify the tests.
files:
  emptiness.py: |
    def is_none(value: object) -> bool:
        return value == None
  test_emptiness.py: |
    from emptiness import is_none


    class Trickster:
        def __eq__(self, other: object) -> bool:
            return True


    def test_is_none_with_none() -> None:
        assert is_none(None) is True


    def test_is_none_with_trickster_should_be_false() -> None:
        assert is_none(Trickster()) is False
verify_command: "pytest -q test_emptiness.py"
