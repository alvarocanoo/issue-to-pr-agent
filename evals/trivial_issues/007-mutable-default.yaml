id: "007-mutable-default"
description: |
  The `append_item` function uses a mutable default argument (`lst: list[int] = []`).
  This is a classic Python pitfall: the same list is reused across calls, so the second
  call sees items left over from the first.

  Fix the function using the standard `None` sentinel pattern.
files:
  appender.py: |
    def append_item(item: int, lst: list[int] = []) -> list[int]:
        lst.append(item)
        return lst
  test_appender.py: |
    from appender import append_item


    def test_first_call_returns_singleton_list() -> None:
        assert append_item(1) == [1]


    def test_second_call_is_independent() -> None:
        append_item(1)  # warm up; should not contaminate next call
        assert append_item(2) == [2]
verify_command: "pytest -q test_appender.py"
