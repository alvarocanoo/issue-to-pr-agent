[project]
name = "issue-to-pr-agent"
version = "0.1.0"
description = "Autonomous agent that turns a GitHub issue into a PR. Hand-rolled tool loop over Groq Cloud + open-source models."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Álvaro Cano" }
]
requires-python = ">=3.12"
dependencies = [
    "groq>=0.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    "asyncpg>=0.29",
]
observability = [
    "langfuse>=2.0",
]

[project.scripts]
issue-to-pr = "issue_to_pr.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/issue_to_pr"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF", "BLE", "ARG"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S"]
"src/issue_to_pr/cli.py" = ["B008"]  # typer requires function calls in arg defaults

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = ["groq.*", "langfuse.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "evals: marks tests as eval suite (slow, hits Groq rate limits)",
    "integration: marks tests that hit external services",
]
addopts = "-ra --strict-markers"
